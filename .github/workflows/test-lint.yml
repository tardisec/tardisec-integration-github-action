name: Tests (lint)

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Tests (lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # MANUAL REVIEW: `make test-lint` pulls the digest-pinned linter images from
          # Docker Hub, whose CDN resolves to rotating Cloudflare and S3 hosts that a
          # fixed allowlist cannot cover. This stays on audit; the list below is staged
          # (NOT enforced) pending reconciliation with a real run's runtime insights.
          egress-policy: audit
          disable-telemetry: true
          allowed-endpoints: >
            auth.docker.io:443
            github.com:443
            index.docker.io:443
            mirror.gcr.io:443
            production.cloudflare.docker.com:443
            registry-1.docker.io:443
      # allowed-endpoints: >
      #   github.com:443
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # allowed-endpoints: >
      #   auth.docker.io:443
      #   index.docker.io:443
      #   mirror.gcr.io:443
      #   production.cloudflare.docker.com:443
      #   registry-1.docker.io:443
      - name: Linting
        run: |
          make test-lint
      # No egress: the test stubs gh.
      - name: PR step test
        run: |
          make test-pr-step
