name: Tests (lint)

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Tests (lint)
    runs-on: ubuntu-latest

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          # MANUAL REVIEW: `make test-lint` pulls the digest-pinned linter images from
          # Docker Hub, whose CDN resolves to rotating Cloudflare and S3 hosts that a
          # fixed allowlist cannot cover. This stays on audit; the list below is staged
          # (NOT enforced) pending reconciliation with a real run's runtime insights.
          egress-policy: audit
          disable-telemetry: true
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            registry-1.docker.io:443
            index.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            mirror.gcr.io:443
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Linting
        run: |
          make test-lint
