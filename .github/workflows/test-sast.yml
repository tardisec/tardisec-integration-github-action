name: 'Test (sast)'

on:
  pull_request:
  schedule:
    - cron: '43 3 * * 5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # https://github.com/aquasecurity/trivy-action
  # There is no lockfile to point at in a config-only repo, so this scans the tree.
  # It is a no-op until a manifest lands, and starts gating the day one does.
  trivy-vuln:
    name: 'Trivy: SCA'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
          allowed-endpoints: >
            api.github.com:443
            check.trivy.dev:443
            get.trivy.dev:443
            ghcr.io:443
            github.com:443
            mirror.gcr.io:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            release-assets.githubusercontent.com:443
      # allowed-endpoints: >
      #   github.com:443
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # allowed-endpoints: >
      #   api.github.com:443
      #   check.trivy.dev:443
      #   get.trivy.dev:443
      #   ghcr.io:443
      #   github.com:443
      #   mirror.gcr.io:443
      #   objects.githubusercontent.com:443
      #   pkg-containers.githubusercontent.com:443
      #   release-assets.githubusercontent.com:443
      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scanners: vuln
          scan-type: fs
          scan-ref: .
          hide-progress: true
          ignore-unfixed: true
          exit-code: 1
          format: github

  trivy-license:
    name: 'Trivy: Licensing'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
          allowed-endpoints: >
            api.github.com:443
            check.trivy.dev:443
            get.trivy.dev:443
            ghcr.io:443
            github.com:443
            mirror.gcr.io:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
      # allowed-endpoints: >
      #   github.com:443
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # allowed-endpoints: >
      #   api.github.com:443
      #   check.trivy.dev:443
      #   get.trivy.dev:443
      #   ghcr.io:443
      #   github.com:443
      #   mirror.gcr.io:443
      #   objects.githubusercontent.com:443
      #   pkg-containers.githubusercontent.com:443
      #   raw.githubusercontent.com:443
      #   release-assets.githubusercontent.com:443
      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scanners: license
          scan-type: fs
          scan-ref: .
          hide-progress: true
          exit-code: 0
          format: table

  # https://semgrep.dev/docs/semgrep-ci/sample-ci-configs/#github-actions
  # There is no compiled source here, so semgrep's value is its shell, Dockerfile and
  # generic secret rules over the templates and hooks.
  semgrep:
    name: 'semgrep: SAST'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    container:
      # https://hub.docker.com/r/semgrep/semgrep/tags
      image: semgrep/semgrep@sha256:3e6e5065d9e68abffddffdb536a8db2d79a8fa92dc424daa48d3a4b7d9bc65d0 # v1.111.0

    steps:
      # harden-runner skipped: this job runs in a container; harden-runner patches the host runner.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: semgrep
        run: semgrep ci

  # https://github.com/raven-actions/actionlint
  actionlint:
    name: 'actionlint: GitHub Actions lint'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # MANUAL REVIEW: actionlint downloads its binary (GitHub releases) and
          # pyflakes (PyPI). Staying on audit; list below is staged (NOT enforced)
          # pending reconciliation with runtime insights.
          egress-policy: audit
          disable-telemetry: true
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            release-assets.githubusercontent.com:443
      # allowed-endpoints: >
      #   github.com:443
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # allowed-endpoints: >
      #   api.github.com:443
      #   files.pythonhosted.org:443
      #   github.com:443
      #   objects.githubusercontent.com:443
      #   pypi.org:443
      #   release-assets.githubusercontent.com:443
      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  # https://github.com/zizmorcore/zizmor-action
  # SPVS V3.1.5 - build systems regularly reviewed for security misconfigurations
  zizmor:
    name: 'zizmor: SAST GitHub Actions'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # MANUAL REVIEW: zizmor-action downloads the zizmor tool (uv/astral, PyPI)
          # and queries the GitHub API. Staying on audit; list below is staged
          # (NOT enforced) pending reconciliation with runtime insights.
          egress-policy: audit
          disable-telemetry: true
          allowed-endpoints: >
            api.github.com:443
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443
      # allowed-endpoints: >
      #   github.com:443
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # allowed-endpoints: >
      #   api.github.com:443
      #   ghcr.io:443
      #   github.com:443
      #   pkg-containers.githubusercontent.com:443
      - name: zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2

  # https://github.com/trufflesecurity/trufflehog
  trufflehog:
    name: 'TruffleHog: secrets'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: (github.actor != 'dependabot[bot]')
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # MANUAL REVIEW: do NOT switch to block. TruffleHog --only-verified
          # validates candidate secrets against arbitrary third-party APIs, so a
          # fixed egress allowlist would break verification by design.
          egress-policy: audit
          disable-telemetry: true
          allowed-endpoints: >
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443
      # allowed-endpoints: >
      #   github.com:443
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # allowed-endpoints: >
      #   ghcr.io:443
      #   github.com:443
      #   pkg-containers.githubusercontent.com:443
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          extra_args: --only-verified --results=verified,unknown

  # https://github.com/gitleaks/gitleaks-action
  gitleaks:
    name: 'gitleaks: secrets'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: (github.actor != 'dependabot[bot]')
    env:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # MANUAL REVIEW: gitleaks-action downloads the gitleaks binary (GitHub
          # releases), calls the GitHub API, and validates the v3 licence against
          # keygen. Staying on audit; list below is staged (NOT enforced) pending
          # reconciliation with runtime insights.
          egress-policy: audit
          disable-telemetry: true
          allowed-endpoints: >
            api.github.com:443
            api.keygen.sh:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
      - name: Require GITLEAKS_LICENSE
        if: env.GITLEAKS_LICENSE == '' && github.event.pull_request.head.repo.fork != true && github.actor != 'dependabot[bot]'
        run: |
          echo "::error::GITLEAKS_LICENSE secret is not set; gitleaks cannot run"
          exit 1
      - name: Note gitleaks skipped on fork PR
        if: env.GITLEAKS_LICENSE == '' && github.event.pull_request.head.repo.fork == true
        run: |
          echo "::notice::gitleaks skipped: fork PRs cannot read GITLEAKS_LICENSE. TruffleHog still scans this PR."
      # allowed-endpoints: >
      #   github.com:443
      - name: Checkout repository
        if: env.GITLEAKS_LICENSE != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # allowed-endpoints: >
      #   api.github.com:443
      #   api.keygen.sh:443
      #   github.com:443
      #   objects.githubusercontent.com:443
      #   release-assets.githubusercontent.com:443
      - name: gitleaks
        if: env.GITLEAKS_LICENSE != ''
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
