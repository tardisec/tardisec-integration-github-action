name: tardisec sync
description: Pull tardisec security config files and open a pull request
branding:
  icon: shield
  color: purple

inputs:
  domain:
    description: Domain the config belongs to, as configured on app.tardisec.com
    required: true
  files:
    description: Config filenames to pull, one per line
    default: .tardisec.json
  path:
    description: Directory to write the files into, relative to the repo root
    default: "."
  format:
    description: >-
      Command run over the fetched files before they are committed, so they match your
      repo's formatter (e.g. "npx biome format --write"). The file paths are appended.
    default: ""
  api:
    description: API origin, also the OIDC audience
    default: https://api.tardisec.com
  pull-request:
    description: Commit changes to the tardisec-config branch and open a pull request
    default: "true"
  token:
    description: Token used to push the branch and open the pull request
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Fetch config
      shell: bash
      env:
        TARDISEC_API: ${{ inputs.api }}
        TARDISEC_DOMAIN: ${{ inputs.domain }}
        TARDISEC_FILES: ${{ inputs.files }}
        TARDISEC_PATH: ${{ inputs.path }}
        TARDISEC_FORMAT: ${{ inputs.format }}
      run: |
        OIDC=$(curl -sSf -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${TARDISEC_API}" | jq -r .value)

        # The path is relative to the repo: a leading / would write at the filesystem root
        # and .. would climb out of the checkout, so normalize one and refuse the other.
        TARDISEC_PATH="${TARDISEC_PATH#/}"
        TARDISEC_PATH="${TARDISEC_PATH%/}"
        case "${TARDISEC_PATH}" in
          ..|../*|*/../*|*/..)
            echo "::error::path must stay inside the repo, got '${TARDISEC_PATH}'"; exit 1 ;;
        esac
        TARDISEC_PATH="${TARDISEC_PATH:-.}"

        # The path is prepended locally only; the URL always uses the allowlisted name, which
        # may itself contain a slash (.well-known/tardisec-verification.txt), hence the dirname.
        fetched=""
        for file in ${TARDISEC_FILES}; do
          mkdir -p "$(dirname "${TARDISEC_PATH}/${file}")"
          curl -sSf -H "Authorization: Bearer ${OIDC}" \
            -o "${TARDISEC_PATH}/${file}" "${TARDISEC_API}/v1/recommendation/${TARDISEC_DOMAIN}/${file}"
          fetched="${fetched} ${TARDISEC_PATH}/${file}"
        done

        # The API cannot serve a body that is clean under every formatter, so hand the files
        # to yours. Only the fetched paths are passed, never the directory: with path "." that
        # would reformat the whole repo into the sync PR.
        # shellcheck disable=SC2086  # both expansions are meant to word-split
        [ -z "${TARDISEC_FORMAT}" ] || ${TARDISEC_FORMAT} ${fetched}

    - name: Open pull request
      if: inputs.pull-request == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        BRANCH: tardisec-config
      run: |
        git add -A  # unscoped: picks up every earlier fetch step, whatever its path
        git diff --cached --quiet && exit 0

        # Commit through the API: GitHub signs it server-side, so no key on the runner and no
        # secret to store. The token's identity is the author, so derive the DCO signoff from it
        # (installation tokens can't read /user, hence the github-actions[bot] fallback).
        read -r LOGIN ID <<<"$(gh api user --jq '"\(.login) \(.id)"' 2>/dev/null \
          || echo 'github-actions[bot] 41898282')"
        BASE_OID=$(git rev-parse HEAD)

        additions=$(git diff --cached --name-only | while IFS= read -r file; do
          jq -n --arg path "${file}" --arg contents "$(base64 "${file}" | tr -d '\n')" '$ARGS.named'
        done | jq -sc .)

        # Reset the branch to the base commit, as the old force-push did; keeps re-runs to one commit.
        gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" \
          -f sha="${BASE_OID}" -F force=true >/dev/null 2>&1 \
          || gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
               -f ref="refs/heads/${BRANCH}" -f sha="${BASE_OID}" >/dev/null

        jq -n --arg repo "${GITHUB_REPOSITORY}" --arg branch "${BRANCH}" --arg oid "${BASE_OID}" \
          --arg body "Signed-off-by: ${LOGIN} <${ID}+${LOGIN}@users.noreply.github.com>" \
          --argjson additions "${additions}" \
          '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
            variables: {input: {
              branch: {repositoryNameWithOwner: $repo, branchName: $branch},
              expectedHeadOid: $oid,
              message: {headline: "chore: sync tardisec config", body: $body},
              fileChanges: {additions: $additions}}}}' \
          | gh api graphql --input - >/dev/null

        if [ -z "$(gh pr list --head "${BRANCH}" --base "${GITHUB_REF_NAME}" --state open \
                     --json number --jq '.[0].number')" ]; then
          gh pr create --title "chore: sync tardisec config" --head "${BRANCH}" \
            --body "Automated config sync from tardisec.com." \
            --base "${GITHUB_REF_NAME}"
        fi  # else the commit above already updated the open PR
